name: Script Validation

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  validate-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify JSON is synced from JS
        run: |
          node script-library/sync-scripts.js
          git diff --exit-code -- script-library/*.json

      - name: Validate FTD schema and safety rules
        run: node script-library/validate-scripts.js